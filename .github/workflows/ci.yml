name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m mypy

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m slumpcone.tools.check_migrations

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # The command reference is generated. This refuses a build where it has
      # drifted from the commands rather than regenerating it, because a check
      # that fixes what it finds is not a check.
      - run: python -m slumpcone.tools.check_docs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m pytest -q
          --cov=slumpcone --cov-report=term-missing --cov-fail-under=95

  smoke:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, migrations, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build
      - run: python -m build --wheel
      # Installed from the wheel, in a clean environment, so anything the
      # package forgot to ship fails here rather than in a plant's hands.
      - run: python -m venv /tmp/smoke
      - run: /tmp/smoke/bin/pip install dist/*.whl
      - name: drive it end to end
        run: |
          set -eux
          cd /tmp
          /tmp/smoke/bin/slumpcone --version
          /tmp/smoke/bin/python -c "from slumpcone.ingest import profiles; print(len(profiles.BUILT_IN))"
          /tmp/smoke/bin/slumpcone register init
          /tmp/smoke/bin/slumpcone demo seed
          /tmp/smoke/bin/slumpcone register info
          /tmp/smoke/bin/slumpcone register verify
          /tmp/smoke/bin/slumpcone register plans
          /tmp/smoke/bin/slumpcone mix check 4000P-57
          /tmp/smoke/bin/slumpcone batch audit --from 2024-06-12 --to 2024-06-12
          /tmp/smoke/bin/slumpcone lab strength --mix 4000P-57
          /tmp/smoke/bin/slumpcone report production --from 2024-06-12 --to 2024-06-12
          /tmp/smoke/bin/slumpcone report compliance --on 2024-06-12
          /tmp/smoke/bin/slumpcone report day --on 2024-06-12
          /tmp/smoke/bin/slumpcone carbon mix 4000P-57
          /tmp/smoke/bin/slumpcone crew gaps --on 2024-06-12
          /tmp/smoke/bin/slumpcone probe list --plant PL-1 --on 2024-06-12
          /tmp/smoke/bin/slumpcone reclaim yard --on 2024-06-12
          /tmp/smoke/bin/slumpcone audit verify
      - name: an exit code a script can branch on
        run: |
          set -eu
          cd /tmp
          set +e
          /tmp/smoke/bin/slumpcone mix show NOPE
          test $? -eq 3
