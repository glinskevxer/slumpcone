[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "slumpcone"
version = "1.0.0"
description = "Ready-mix concrete production, quality control and delivery compliance"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "glinskevxer" }]
dependencies = ["click==8.1.3"]

[project.optional-dependencies]
# These are the versions check.sh runs and the versions CI installs. They are
# pinned exactly, and tests/test_dev_pins.py asserts the running tool agrees
# with the pin. Before that test existed this list was written once and never
# updated, and nothing noticed for 180 commits: check.sh calls the tools out of
# the virtualenv directly and never installs this extra, so CI was the first
# thing that ever read it.
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "coverage==7.6.12",
  "ruff==0.9.6",
  "mypy==1.15.0",
]

[project.scripts]
slumpcone = "slumpcone.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slumpcone"]
# The schema scripts and the typing marker are not .py files and would be left
# out of the wheel otherwise. The smoke job installs from the wheel and drives
# the whole command line, which is where a missing migration would show.
artifacts = ["src/slumpcone/store/schema/*.sql", "src/slumpcone/py.typed"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "N"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The domain is full of records called StrengthTest, BreakTest and TestRecord.
# Collection by class name drags those in out of whatever module imports them,
# so the pattern is narrowed to something no record will ever be called.
python_classes = ["Case*"]
