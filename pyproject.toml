[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "slumpcone"
version = "0.1.0"
description = "Ready-mix concrete production, quality control and delivery compliance"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "glinskevxer" }]

[project.optional-dependencies]
dev = [
  "pytest==8.0.0",
  "ruff==0.2.1",
  "mypy==1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slumpcone"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "N"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The domain is full of records called StrengthTest, BreakTest and TestRecord.
# Collection by class name drags those in out of whatever module imports them,
# so the pattern is narrowed to something no record will ever be called.
python_classes = ["Case*"]
